<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PeterParker</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <!-- Auth view: shown until the user has a valid session -->
    <main id="auth-view" class="auth" hidden>
      <!-- Decorative background shapes -->
      <div class="backdrop" aria-hidden="true">
        <span class="shape circle-lg"></span>
        <span class="shape circle-md"></span>
        <span class="shape square"></span>
        <span class="shape ring"></span>
        <span class="shape dot"></span>
        <span class="shape bar"></span>
      </div>

      <section class="auth-card">
        <div class="card-top">
          <div class="brand">
            <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>PeterParker</span>
          </div>
          <img class="partner-logo" src="assets/uci-logo.svg" alt="UC Irvine" />
        </div>
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-subtitle" class="subtitle">Sign in to continue.</p>

        <div class="tabs" role="tablist" data-mode="login">
          <span class="tab-thumb" aria-hidden="true"></span>
          <button type="button" role="tab" class="tab active" data-mode="login" aria-selected="true">Sign in</button>
          <button type="button" role="tab" class="tab" data-mode="signup" aria-selected="false">Sign up</button>
        </div>

        <form id="auth-form" novalidate>
          <!-- Sign in: one field that accepts either -->
          <label data-show="login">
            Username or email
            <input id="auth-identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" />
          </label>
          <!-- Sign up: both are collected -->
          <label data-show="signup" hidden>
            Username
            <input id="auth-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" />
          </label>
          <label data-show="signup" hidden>
            Email
            <input id="auth-email" type="email" autocomplete="email" />
          </label>
          <label>
            Password
            <input id="auth-password" type="password" autocomplete="current-password" aria-describedby="password-rules" />
          </label>
          <ul id="password-rules" class="rules" data-show="signup" aria-label="Password requirements" hidden>
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="capital">One capital letter</li>
            <li data-rule="special">One special character (e.g. ! @ # $)</li>
          </ul>
          <label class="checkbox">
            <input id="auth-remember" type="checkbox" />
            Remember Me
          </label>
          <p id="auth-error" class="error" hidden></p>
          <button id="auth-submit" type="submit">Sign in</button>
        </form>
      </section>
    </main>

    <!-- App view -->
    <main id="app-view" class="container" hidden>
      <header class="app-header">
        <div>
          <h1>PeterParker</h1>
          <p class="status">API: <span id="api-status" class="badge">checking…</span></p>
        </div>
        <div class="user">
          <span id="user-name"></span>
          <button id="logout" type="button" class="secondary">Sign out</button>
        </div>
      </header>

      <section class="card">
        <h2>Items</h2>
        <form id="item-form">
          <input id="item-name" name="name" placeholder="New item" required autocomplete="off" />
          <button type="submit">Add</button>
        </form>
        <ul id="item-list"></ul>
        <p id="error" class="error" hidden></p>
      </section>
    </main>
  </body>
</html>
