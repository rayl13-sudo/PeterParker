<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="js/open-from-disk.js"></script>
    <script src="js/page-transitions.js"></script>
    <title>PeterParker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <!-- Auth view: shown until the user has a valid session -->
    <main id="auth-view" class="auth" hidden>
      <!-- Decorative background: a faded map of campus that fades out toward the edges -->
      <div class="backdrop" aria-hidden="true">
        <div id="auth-map" class="auth-map"></div>
      </div>

      <section class="auth-card">
        <div class="card-top">
          <div class="brand">
            <a href="map.html" aria-label="Back to map"><img class="mascot-logo" src="assets/peterparker-mascot.png" alt="" width="44" height="48" /></a>
            <span>PeterParker</span>
          </div>
          <img class="partner-logo" src="assets/uci-logo.svg" alt="UC Irvine" />
        </div>
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-subtitle" class="subtitle">Sign in to continue.</p>

        <div class="tabs" role="tablist" data-mode="login">
          <span class="tab-thumb" aria-hidden="true"></span>
          <button type="button" role="tab" class="tab active" data-mode="login" aria-selected="true">Sign in</button>
          <button type="button" role="tab" class="tab" data-mode="signup" aria-selected="false">Sign up</button>
        </div>

        <form id="auth-form" novalidate>
          <!-- Sign in: one field that accepts either -->
          <label data-show="login">
            Username or email
            <span class="input-with-icon">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><circle class="cut" cx="12" cy="9.5" r="3.6"/><path class="cut" d="M5.6 19.2c1.4-2.9 3.7-4.4 6.4-4.4s5 1.5 6.4 4.4"/></svg>
              <input id="auth-identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" />
            </span>
          </label>
          <!-- Sign up: both are collected -->
          <label data-show="signup" hidden>
            Username
            <span class="input-with-icon">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><circle class="cut" cx="12" cy="9.5" r="3.6"/><path class="cut" d="M5.6 19.2c1.4-2.9 3.7-4.4 6.4-4.4s5 1.5 6.4 4.4"/></svg>
              <input id="auth-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" />
            </span>
          </label>
          <label data-show="signup" hidden>
            Email
            <span class="input-with-icon">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><rect class="stroke" x="5.8" y="7.6" width="12.4" height="8.8" rx="1.6"/><path class="stroke" d="M6.4 8.6l5.6 4.2 5.6-4.2"/></svg>
              <input id="auth-email" type="email" autocomplete="email" />
            </span>
          </label>
          <label>
            Password
            <span class="input-with-icon">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><rect class="cut" x="6.8" y="10.6" width="10.4" height="7.8" rx="1.6"/><path class="stroke" d="M8.9 10.6V8.6a3.1 3.1 0 0 1 6.2 0v2"/></svg>
              <input id="auth-password" type="password" autocomplete="current-password" aria-describedby="password-rules" />
            </span>
          </label>
          <ul id="password-rules" class="rules" data-show="signup" aria-label="Password requirements" hidden>
            <li data-rule="length">At least 8 characters</li>
            <li data-rule="capital">One capital letter</li>
            <li data-rule="special">One special character (e.g. ! @ # $)</li>
          </ul>
          <label class="checkbox">
            <input id="auth-remember" type="checkbox" />
            Remember Me
          </label>
          <p id="auth-error" class="error" hidden></p>
          <button id="auth-submit" type="submit">Sign in</button>
        </form>
      </section>

      <p class="map-credit">Map &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
    </main>
  </body>
</html>
