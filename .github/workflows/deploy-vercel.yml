name: Deploy to Vercel

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-flight deployment before starting the latest push to the same branch.
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Check repository write access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Re-runs must also be initiated by someone with repository write access.
            const actors = new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR]);
            for (const username of actors) {
              if (!username) continue;
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              if (!['admin', 'maintain', 'write'].includes(data.permission)) {
                core.setFailed(`${username} must have repository write access to deploy.`);
                return;
              }
            }

  test:
    name: Test frontend and backend
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Check frontend JavaScript and run tests
        shell: bash
        run: |
          for file in frontend/js/*.js frontend/js/*.mjs; do
            node --check "$file"
          done
          node --test frontend/tests/*.test.mjs

  deploy:
    name: Deploy ${{ matrix.project }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: backend
            project_secret: VERCEL_BACKEND_PROJECT_ID
          - project: frontend
            project_secret: VERCEL_FRONTEND_PROJECT_ID
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Follow docs/vercel-deployment.md."
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # Run at the repository root; each linked Vercel project supplies its Root Directory.
      - name: Pull Vercel project configuration
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - name: Build and deploy
        shell: bash
        run: |
          if [ "$VERCEL_TARGET" = production ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN"
          fi
