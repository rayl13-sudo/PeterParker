name: Deploy to Vercel

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    name: Check repository write access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Re-runs must also be initiated by someone with repository write access.
            const actors = new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR]);
            for (const username of actors) {
              if (!username) continue;
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              if (!['admin', 'maintain', 'write'].includes(data.permission)) {
                core.setFailed(`${username} must have repository write access to deploy.`);
                return;
              }
            }

  changes:
    name: Detect changed projects
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.paths.outputs.matrix }}
      any: ${{ steps.paths.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Select projects from changed paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], stdin=subprocess.DEVNULL)

          base = os.environ.get("BEFORE_SHA", "")
          if not base:
              # Manual runs inspect the latest commit.
              try:
                  base = git("rev-parse", "HEAD^").decode().strip()
              except subprocess.CalledProcessError:
                  base = "0" * 40
          if set(base) == {"0"}:
              # A new branch has no previous push: include its complete contents.
              base = git("hash-object", "-t", "tree", "--stdin").decode().strip()
          paths = git("diff", "--no-renames", "--name-only", "-z", base, "HEAD").split(b"\0")
          projects = [
              {"project": project, "project_secret": secret}
              for project, secret in [
                  ("backend", "VERCEL_BACKEND_PROJECT_ID"),
                  ("frontend", "VERCEL_FRONTEND_PROJECT_ID"),
              ]
              if any(path.startswith((project + "/").encode()) for path in paths)
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": projects}) + "\n")
              output.write("any=" + str(bool(projects)).lower() + "\n")
          PY

  test:
    name: Test frontend and backend
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Check frontend JavaScript and run tests
        shell: bash
        run: |
          for file in frontend/js/*.js frontend/js/*.mjs; do
            node --check "$file"
          done
          node --test frontend/tests/*.test.mjs

  deploy:
    name: Deploy ${{ matrix.project }}
    needs: [changes, test]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    # Queue each project separately so a backend push cannot skip a pending frontend deploy.
    concurrency:
      group: vercel-${{ github.ref }}-${{ matrix.project }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Check deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Follow docs/vercel-deployment.md."
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # Run at the repository root; each linked Vercel project supplies its Root Directory.
      - name: Pull Vercel project configuration
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - name: Build and deploy
        shell: bash
        run: |
          if [ "$VERCEL_TARGET" = production ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN"
          fi
